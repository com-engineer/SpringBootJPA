services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres-container
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=pass
    networks:
      - oms-network
    volumes:
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/authdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=pass
      - JWT_SECRET=hlkdhfkjhawueyryewye89uh87w6hcsug7we6i87rieooiuoitnkjdshkafhskdfhiueyr769843
    depends_on:
      - postgres
    networks:
      - oms-network

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/productdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=pass
      - JWT_SECRET=hlkdhfkjhawueyryewye89uh87w6hcsug7we6i87rieooiuoitnkjdshkafhskdfhiueyr769843
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=host.docker.internal:9092
    depends_on:
      - postgres
    networks:
      - oms-network

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/orderdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=pass
      - JWT_SECRET=hlkdhfkjhawueyryewye89uh87w6hcsug7we6i87rieooiuoitnkjdshkafhskdfhiueyr769843
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=host.docker.internal:9092
      - SERVICES_PRODUCT_URL=http://product-service:8082
    depends_on:
      - postgres
    networks:
      - oms-network

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=host.docker.internal:9092
    networks:
      - oms-network

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: analytics-service
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=host.docker.internal:9092
    networks:
      - oms-network

  log-viewer:
    image: amir20/dozzle:latest
    container_name: log-viewer
    ports:
      - "8088:8080"
    networks:
      - oms-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  oms-network:
    driver: bridge
